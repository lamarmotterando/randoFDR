<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Test géocodage — La Marmotte</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;color:#23291f;background:#f4efe4;}
  header{background:#274a36;color:#f1ede1;padding:12px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  header h1{font-size:17px;margin:0;flex:1;}
  select,button{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid #c9c1ad;}
  button{background:#4C9A5E;color:#fff;border-color:#4C9A5E;cursor:pointer;}
  .wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;}
  #map{height:calc(100vh - 90px);min-height:420px;border-radius:12px;border:1px solid #e2dac8;}
  .tbl{background:#fff;border:1px solid #e2dac8;border-radius:12px;overflow:auto;max-height:calc(100vh - 90px);}
  table{border-collapse:collapse;width:100%;font-size:12.5px;}
  th{position:sticky;top:0;background:#274a36;color:#fff;text-align:left;padding:7px 8px;font-weight:600;}
  td{padding:6px 8px;border-bottom:1px solid #eee5d3;vertical-align:top;}
  tr.ok td:first-child{border-left:4px solid #4C9A5E;}
  tr.doute td:first-child{border-left:4px solid #D9883D;}
  tr.ko td:first-child{border-left:4px solid #9E3B2E;}
  tr:hover td{background:#fbf8f1;cursor:pointer;}
  .mut{color:#7c8472;}
  #resume{font-size:13px;}
  @media (max-width:900px){ .wrap{grid-template-columns:1fr;} #map{height:50vh;} .tbl{max-height:none;} }
</style>
</head>
<body>
<header>
  <h1>🧪 Test géocodage des fiches sans GPS (commune uniquement)</h1>
  <label>Saison <select id="saison"></select></label>
  <button id="go">Lancer le test</button>
  <span id="resume" class="mut">—</span>
</header>
<div class="wrap">
  <div class="tbl">
    <table>
      <thead><tr><th>Date</th><th>Rando</th><th>Recherché [source]</th><th>Commune trouvée</th><th>Score</th><th>Dist. Châteaurenard</th></tr></thead>
      <tbody id="body"><tr><td colspan="6" class="mut">Choisir une saison puis « Lancer le test ».</td></tr></tbody>
    </table>
  </div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* Page de TEST — n'écrit rien en base.
   Lit les fiches de la saison (dynamic-handler → getFiches), garde celles sans GPS,
   géocode le « lieu » (à défaut parking_depart, puis nom de la rando) via l'IGN en ne cherchant QUE des communes (type=municipality).
   Vert : score ≥ 0,7 · Orange : 0,4–0,7 ou > 120 km de Châteaurenard · Rouge : non trouvé. */
(function () {
  const API = 'https://whlxbfnmyqdflmxosfse.supabase.co/functions/v1/dynamic-handler';
  const GEOCODE = 'https://data.geopf.fr/geocodage/search';
  const BASE = [43.8828, 4.8547];   /* Châteaurenard */
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  const map = L.map('map').setView(BASE, 9);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 18, attribution: 'Tuiles © Esri' }).addTo(map);
  L.circleMarker(BASE, { radius: 6, color: '#274a36', fillOpacity: 1 }).bindTooltip('Châteaurenard').addTo(map);
  const couche = L.layerGroup().addTo(map);

  const sel = document.getElementById('saison');
  const d = new Date(); const courante = d.getMonth() >= 8 ? d.getFullYear() : d.getFullYear() - 1;
  for (let y = courante; y >= 2024; y--) sel.add(new Option(`${y}/${y + 1}`, y, false, y === 2025));

  function distKm(a, b) {
    const R = 6371, r = Math.PI / 180;
    const dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function aGps(s) { return /(-?\d{1,2}\.\d+)\s*[,; ]\s*(-?\d{1,3}\.\d+)/.test(String(s || '')); }

  async function geocoderCommune(lieu) {
    const q = String(lieu || '').replace(/[()]/g, ' ').replace(/\s+/g, ' ').trim();
    if (q.length < 3) return { erreur: 'lieu vide' };
    try {
      const url = `${GEOCODE}?q=${encodeURIComponent(q)}&type=municipality&limit=1&lat=${BASE[0]}&lon=${BASE[1]}`;
      const r = await fetch(url);
      if (!r.ok) return { erreur: 'HTTP ' + r.status };
      const f = (await r.json()).features?.[0];
      if (!f) return { erreur: 'non trouvé' };
      const [lon, lat] = f.geometry.coordinates;
      return { lat, lon, label: f.properties.label || f.properties.city, cp: f.properties.postcode || '', score: f.properties.score ?? 0 };
    } catch (e) { return { erreur: 'réseau : ' + e.message }; }
  }

  async function lancer() {
    const Y = +sel.value;
    const body = document.getElementById('body');
    const resume = document.getElementById('resume');
    body.innerHTML = '<tr><td colspan="6" class="mut">Chargement des fiches…</td></tr>';
    couche.clearLayers();

    let rows;
    try {
      const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'getFiches', select: 'id,date_rando,nom_rando,lieu,parking_depart,gps,statut,type',
          filters: `date_rando=gte.${Y}-09-01&date_rando=lte.${Y + 1}-08-31`, order: 'date_rando.asc' }) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      rows = await res.json();
    } catch (e) { body.innerHTML = `<tr><td colspan="6">Erreur chargement fiches : ${esc(e.message)}</td></tr>`; return; }

    const sansGps = rows.filter(r => r.date_rando && r.type !== 'sejour' && r.type !== 'autre'
      && (r.statut || '') !== 'annulée' && !aGps(r.gps));
    if (!sansGps.length) { body.innerHTML = '<tr><td colspan="6" class="mut">Aucune fiche sans GPS sur cette saison.</td></tr>'; resume.textContent = '0 fiche'; return; }

    body.innerHTML = `<tr><td colspan="6" class="mut">Géocodage de ${sansGps.length} fiches…</td></tr>`;
    const source = r => r.lieu ? ['lieu', r.lieu] : r.parking_depart ? ['parking', r.parking_depart] : ['nom', r.nom_rando || ''];
    sansGps.forEach(r => { [r._src, r._q] = source(r); });
    const lieux = [...new Set(sansGps.map(r => r._q))];
    const res = new Map(await Promise.all(lieux.map(async l => [l, await geocoderCommune(l)])));

    let nOk = 0, nDoute = 0, nKo = 0; const pts = [];
    body.innerHTML = sansGps.map(r => {
      const g = res.get(r._q);
      const lieuAff = `<span class="mut">[${r._src}]</span> ${esc(r._q) || '<i class="mut">vide</i>'}`;
      if (g.erreur) { nKo++; return `<tr class="ko"><td>${esc(r.date_rando)}</td><td>${esc(r.nom_rando)}</td><td>${lieuAff}</td><td colspan="3">❌ ${esc(g.erreur)}</td></tr>`; }
      const km = Math.round(distKm(BASE, [g.lat, g.lon]));
      const doute = g.score < 0.7 || km > 120;
      doute ? nDoute++ : nOk++;
      const coul = doute ? '#D9883D' : '#4C9A5E';
      const mk = L.circleMarker([g.lat, g.lon], { radius: 7, color: '#fff', weight: 2, fillColor: coul, fillOpacity: .95 })
        .bindPopup(`<b>${esc(r.nom_rando)}</b><br>${esc(r.date_rando)}<br>Recherche [${r._src}] : ${esc(r._q)}<br>Trouvé : ${esc(g.label)} ${esc(g.cp)}<br>Score ${g.score.toFixed(2)} · ${km} km`)
        .addTo(couche);
      pts.push([g.lat, g.lon]);
      return `<tr class="${doute ? 'doute' : 'ok'}" data-lat="${g.lat}" data-lon="${g.lon}"><td>${esc(r.date_rando)}</td><td>${esc(r.nom_rando)}</td><td>${lieuAff}</td><td>${esc(g.label)} <span class="mut">${esc(g.cp)}</span></td><td>${g.score.toFixed(2)}</td><td>${km} km</td></tr>`;
    }).join('');

    body.querySelectorAll('tr[data-lat]').forEach(tr => tr.addEventListener('click', () => map.setView([+tr.dataset.lat, +tr.dataset.lon], 12)));
    if (pts.length) map.fitBounds(L.latLngBounds([...pts, BASE]), { padding: [30, 30] });
    resume.textContent = `${sansGps.length} fiches sans GPS · ✅ ${nOk} fiables · ⚠️ ${nDoute} à vérifier · ❌ ${nKo} non trouvées`;
  }

  document.getElementById('go').addEventListener('click', lancer);
})();
</script>
</body>
</html>
