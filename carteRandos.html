<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte de la saison 2025/2026 — La Marmotte</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#274a36; --moss:#4C9A5E; --bark:#5b4636;
    --cream:#f4efe4; --paper:#fbf8f1; --line:#e2dac8; --ink:#23291f; --mut:#7c8472;
    --shadow:0 10px 30px -12px rgba(28,45,30,.45);
    --r:16px; --sans:'Inter Tight',system-ui,sans-serif; --serif:'Fraunces',Georgia,serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;height:100vh;height:100dvh;font-family:var(--sans);color:var(--ink);background:var(--cream);display:flex;flex-direction:column;overflow:hidden;}

  .topbar{flex:0 0 auto;display:flex;align-items:center;gap:18px;padding:12px 18px;background:var(--forest);color:#f1ede1;border-bottom:3px solid #16261c;z-index:1200;}
  .brand-t{display:flex;align-items:baseline;gap:10px;min-width:0;}
  .brand-t .glyph{font-size:20px;}
  .brand-t h1{font-family:var(--serif);font-weight:600;font-size:19px;margin:0;white-space:nowrap;}
  .brand-t span{color:#a9c3ad;font-size:12.5px;white-space:nowrap;}
  .spacer{flex:1 1 auto;}
  .seg{display:flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px;}
  .seg-btn{appearance:none;border:0;background:transparent;color:#cfe0d0;cursor:pointer;font-family:var(--sans);font-weight:600;font-size:13px;padding:7px 14px;border-radius:999px;display:flex;flex-direction:column;align-items:center;line-height:1.05;transition:.15s;}
  .seg-btn small{font-weight:500;font-size:10px;opacity:.7;letter-spacing:.3px;}
  .seg-btn.on{background:#f1ede1;color:var(--forest);box-shadow:0 1px 4px rgba(0,0,0,.2);}
  .seg-btn:not(.on):hover{color:#fff;}
  .retour{color:#b9cdbb;text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap;}
  .retour:hover{color:#fff;}

  .stage{flex:1 1 auto;display:flex;min-height:0;position:relative;}
  .map-wrap{position:relative;flex:1 1 auto;min-width:0;}
  #map{position:absolute;inset:0;background:#dfe6d8;}
  body[data-dir="c"] #map{background:#10161a;}

  .panel{flex:0 0 372px;display:none;flex-direction:column;min-height:0;background:var(--paper);border-right:1px solid var(--line);}
  body[data-dir="b"] .panel{display:flex;}
  .panel-head{padding:15px 16px 12px;border-bottom:1px solid var(--line);}
  .panel-head h2{font-family:var(--serif);font-weight:600;font-size:17px;margin:0 0 2px;}
  .panel-head .ph-period{font-size:11.5px;color:var(--mut);margin-bottom:9px;}
  .search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px 11px;}
  .search svg{flex:0 0 auto;color:var(--mut);}
  .search input{border:0;outline:0;font-family:var(--sans);font-size:14px;width:100%;background:transparent;color:var(--ink);}
  .ph-sub{font-size:12px;color:var(--mut);margin-top:9px;}
  .ph-sub b{color:var(--moss);}
  #list{overflow:auto;padding:9px 11px 24px;display:flex;flex-direction:column;gap:7px;}
  .empty{padding:30px 10px;text-align:center;color:var(--mut);font-size:13px;}

  .li{appearance:none;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px 0;min-height:60px;overflow:hidden;font-family:var(--sans);transition:.13s;}
  .li:hover{border-color:#cdbf9f;transform:translateY(-1px);box-shadow:0 6px 16px -10px rgba(40,60,40,.4);}
  .li.is-sel{border-color:var(--lv);box-shadow:0 0 0 2px var(--lv) inset, var(--shadow);}
  .li-stripe{flex:0 0 5px;align-self:stretch;background:var(--lv);border-radius:5px;margin:2px 0 2px 2px;}
  .li-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;padding-left:7px;}
  .li-top{display:flex;align-items:center;gap:8px;}
  .li-date{font-weight:700;font-size:11px;color:var(--bark);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;}
  .li-sec{font-size:11px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .li-name{font-family:var(--serif);font-weight:600;font-size:14.5px;line-height:1.15;}
  .li-stats{font-size:11.5px;color:var(--mut);}
  .li-ibp{flex:0 0 auto;align-self:center;display:flex;flex-direction:column;align-items:center;color:var(--lv);line-height:1;padding-right:4px;}
  .li-ibp b{font-family:var(--serif);font-size:21px;font-weight:700;}
  .li-ibp i{font-style:normal;font-size:8.5px;line-height:1.2;font-weight:600;text-transform:uppercase;letter-spacing:.2px;opacity:.85;white-space:nowrap;}

  .float{position:absolute;z-index:1000;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;width:240px;display:none;max-height:calc(100% - 32px);overflow:auto;}
  body[data-dir="a"] .float{display:block;left:16px;bottom:16px;}
  body[data-dir="c"] .float{display:block;left:16px;top:16px;background:rgba(22,30,26,.82);border-color:rgba(255,255,255,.12);color:#e9efe5;backdrop-filter:blur(10px);}
  .float h2{font-family:var(--serif);font-weight:600;font-size:15px;margin:0 0 2px;display:flex;align-items:center;gap:7px;}
  .float .f-sub{font-size:11.5px;color:var(--mut);margin-bottom:11px;}
  body[data-dir="c"] .float .f-sub{color:#a9b6a8;}
  .float .f-sub b{color:var(--moss);}
  .legend{display:flex;flex-direction:column;gap:6px;}
  .lg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink);white-space:nowrap;}
  body[data-dir="c"] .lg{color:#dde6db;}
  .lg-dot{width:11px;height:11px;border-radius:3px;flex:0 0 auto;}
  .lg i{margin-left:auto;font-style:normal;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums;}
  body[data-dir="c"] .lg i{color:#93a194;}

  .mk{background:none;border:0;}
  .pin{display:flex;align-items:center;justify-content:center;width:30px;height:30px;background:var(--lv);border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 4px 9px -3px rgba(0,0,0,.5);border:2px solid #fff;}
  .pin b{transform:rotate(45deg);color:#fff;font-size:11px;font-weight:700;font-family:var(--sans);}
  .ring{display:block;width:18px;height:18px;border-radius:50%;background:var(--lv);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .15s;}
  .ring.is-sel{transform:scale(1.35);box-shadow:0 0 0 4px rgba(255,255,255,.55),0 3px 8px rgba(0,0,0,.4);}
  .dot{display:block;width:14px;height:14px;border-radius:50%;background:var(--lv);border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 4px color-mix(in srgb,var(--lv) 35%,transparent),0 0 12px var(--lv);}
  .dot.is-sel{transform:scale(1.4);}

  .cl-wrap{background:none;}
  .cl{display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;font-family:var(--sans);font-size:14px;border:2px solid #fff;box-shadow:0 4px 12px -3px rgba(0,0,0,.5);}
  .cl-a,.cl-b{background:radial-gradient(circle at 35% 30%, #5aa86b, #274a36);}
  .cl-c{background:radial-gradient(circle at 35% 30%, #4C9A5E, #16261c);border-color:rgba(255,255,255,.4);box-shadow:0 0 0 5px rgba(76,154,94,.22),0 4px 12px rgba(0,0,0,.5);}

  .leaflet-popup-content-wrapper{padding:0;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);}
  .leaflet-popup-content{margin:0;width:300px!important;}
  .rando-pop .leaflet-popup-tip{background:#fff;}
  .card{background:#fff;font-family:var(--sans);overflow:hidden;}
  .card-head{position:relative;padding:15px 18px 14px;color:#fff;background:linear-gradient(150deg,var(--lv),color-mix(in srgb,var(--lv) 70%,#000));}
  .card-when{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;opacity:.92;}
  .card-title{font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.1;margin:4px 0 0;max-width:205px;}
  .card-ibp{position:absolute;top:14px;right:16px;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:6px 10px;}
  .card-ibp .ibp-num{font-family:var(--serif);font-weight:700;font-size:23px;line-height:1;}
  .card-ibp .ibp-lab{font-size:9px;font-weight:600;line-height:1.05;text-transform:uppercase;letter-spacing:.3px;}
  .card-body{padding:14px 18px 16px;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:8px 6px;text-align:center;}
  .stat .sv{display:block;font-family:var(--serif);font-weight:600;font-size:16px;line-height:1;}
  .stat .slk{display:block;font-size:10px;color:var(--mut);margin-top:3px;text-transform:uppercase;letter-spacing:.3px;}
  .scales{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
  .scale{display:flex;align-items:center;gap:10px;}
  .scale .sl{font-size:11.5px;color:var(--mut);width:78px;}
  .sdots{display:flex;gap:4px;}
  .sd{width:11px;height:11px;border-radius:50%;background:var(--line);}
  .sd.on{background:var(--lv);}
  .meta{margin:0 0 11px;display:flex;flex-direction:column;gap:8px;}
  .meta div{display:flex;flex-direction:column;}
  .meta dt{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);font-weight:600;}
  .meta dd{margin:1px 0 0;font-size:13px;}
  .approx{display:inline-block;font-size:9.5px;font-weight:600;color:var(--bark);background:#efe7d2;border:1px solid var(--line);border-radius:6px;padding:1px 5px;vertical-align:middle;}
  .remark{margin:0 0 12px;font-size:12.5px;line-height:1.45;color:#4a5142;border-left:3px solid var(--moss);padding:4px 0 4px 11px;background:linear-gradient(90deg,rgba(76,154,94,.07),transparent);}
  .links{display:flex;gap:9px;}
  .lnk{flex:1 1 0;text-align:center;text-decoration:none;font-weight:600;font-size:12.5px;padding:10px 8px;border-radius:11px;background:var(--moss);color:#fff;display:flex;align-items:center;justify-content:center;gap:5px;transition:.15s;}
  .lnk span{font-size:11px;opacity:.85;}
  .lnk:hover{filter:brightness(1.07);}
  .lnk.alt{background:var(--paper);color:var(--ink);border:1px solid var(--line);}

  #hero{position:absolute;z-index:1100;right:16px;top:16px;bottom:16px;width:344px;display:none;overflow:auto;border-radius:20px;box-shadow:0 24px 60px -20px rgba(0,0,0,.7);}
  #hero.show{display:block;}
  #hero .card{border-radius:20px;}
  #hero .card-title{font-size:23px;max-width:215px;}
  #hero .hero-close{position:absolute;top:12px;left:12px;z-index:5;width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.25);color:#fff;cursor:pointer;font-size:13px;backdrop-filter:blur(4px);}
  #hero .hero-close:hover{background:rgba(0,0,0,.45);}

  .leaflet-control-zoom a{border-radius:8px!important;color:var(--forest)!important;}

  @media (max-width:820px){
    .brand-t span{display:none;}
    .seg-btn{padding:6px 10px;} .seg-btn small{display:none;}
    .topbar{gap:10px;padding:10px 12px;} .retour{display:none;}
    body[data-dir="b"] .stage{flex-direction:column;}
    body[data-dir="b"] .panel{flex:0 0 48%;order:2;border-right:0;border-top:1px solid var(--line);}
    body[data-dir="b"] .map-wrap{order:1;flex:1 1 52%;}
    .float{width:auto;left:12px;right:12px;}
    body[data-dir="a"] .float{bottom:12px;}
    body[data-dir="a"] .legend{flex-direction:row;flex-wrap:wrap;gap:6px 14px;}
    body[data-dir="a"] .lg i{display:none;}
    #hero{left:12px;right:12px;width:auto;top:auto;bottom:12px;height:62%;}
  }
</style>
</head>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
/* Logique carte — saison 2025/2026.
   Couleur par IBP, géoloc des lieux, clustering, recherche, tri chronologique, 3 directions. */

(function () {
  const RAW = (window.randosSaison || []).slice().sort((a, b) => a.date.localeCompare(b.date));
  let map, tileLayer, cluster;
  let currentDir = 'a';
  let selectedId = null;
  let query = '';

  /* ---------- Niveaux IBP (palette nature, chaude) ---------- */
  const BANDS = [
    { max: 40,  label: 'Facile',         color: '#4C9A5E' },
    { max: 65,  label: 'Modéré',         color: '#C7A23B' },
    { max: 90,  label: 'Soutenu',        color: '#D9883D' },
    { max: 115, label: 'Difficile',      color: '#C25A38' },
    { max: 999, label: 'Très difficile', color: '#9E3B2E' }
  ];
  const NA = { label: 'IBP non renseigné', color: '#8A8576' };
  function levelOf(ibp) {
    if (ibp == null) return NA;
    return BANDS.find(b => ibp <= b.max) || BANDS[BANDS.length - 1];
  }

  const RANDOS = RAW.map(h => ({ ...h, level: levelOf(h.ibp) }));
  const norm = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

  const MONTHS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  const WD = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
  function fmtDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    return `${WD[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  }
  function fmtShort(iso) {
    const d = new Date(iso + 'T00:00:00');
    return `${String(d.getDate()).padStart(2, '0')} ${MONTHS[d.getMonth()]}`;
  }

  /* échelle 1-5 (effort / technicité / risque) */
  function scale(label, n) {
    if (n == null) return '';
    let dots = '';
    for (let i = 1; i <= 5; i++) dots += `<span class="sd ${i <= n ? 'on' : ''}"></span>`;
    return `<div class="scale"><span class="sl">${label}</span><span class="sdots">${dots}</span></div>`;
  }

  /* ---------- Carte enrichie (popup A / hero C) ---------- */
  function richCard(h, variant) {
    const lv = h.level;
    const g = `https://www.google.com/maps/search/?api=1&query=${h.lat},${h.lon}`;
    const ign = `https://www.geoportail.gouv.fr/carte?c=${h.lon},${h.lat}&z=15&l0=GEOGRAPHICALGRIDSYSTEMS.MAPS::GEOPORTAIL:OGC:WMTS(1)`;
    const approx = h.geo === 'lieu'
      ? `<span class="approx" title="Position approchée déduite du lieu">≈ lieu</span>` : '';
    const ibpTxt = h.ibp == null ? '—' : h.ibp;
    const scales = (h.effort != null || h.technicite != null || h.risque != null)
      ? `<div class="scales">${scale('Effort', h.effort)}${scale('Technicité', h.technicite)}${scale('Risque', h.risque)}</div>` : '';
    const stats = `<div class="stats">
        <div class="stat"><span class="sv">${(h.distance != null ? h.distance.toString().replace('.', ',') : '—')}</span><span class="slk">km</span></div>
        <div class="stat"><span class="sv">${h.denivele != null ? h.denivele : '—'}</span><span class="slk">m D+</span></div>
        <div class="stat"><span class="sv">${h.duree || '—'}</span><span class="slk">durée</span></div>
      </div>`;
    const meta = `<dl class="meta">
        <div><dt>Animateur·trice</dt><dd>${h.animateur || '—'}</dd></div>
        <div><dt>Lieu de départ</dt><dd>${h.lieu || '—'} ${approx}</dd></div>
        ${h.couts ? `<div><dt>Covoiturage</dt><dd>${h.couts}</dd></div>` : ''}
      </dl>`;
    const rem = h.remarques ? `<p class="remark">${h.remarques}</p>` : '';
    return `<article class="card ${variant}">
      <header class="card-head" style="--lv:${lv.color}">
        <div class="card-when">${fmtDate(h.date)}</div>
        <h3 class="card-title">${h.nom}</h3>
        <div class="card-ibp"><span class="ibp-num">${ibpTxt}</span><span class="ibp-lab">IBP<br>${lv.label}</span></div>
      </header>
      <div class="card-body">
        ${stats}${scales}${meta}${rem}
        <div class="links">
          <a class="lnk" href="${ign}" target="_blank" rel="noopener">Carte IGN <span>↗</span></a>
          <a class="lnk alt" href="${g}" target="_blank" rel="noopener">Google Maps <span>↗</span></a>
        </div>
      </div>
    </article>`;
  }

  function listItem(h) {
    const lv = h.level;
    const ibpTxt = h.ibp == null ? '—' : h.ibp;
    return `<button class="li ${selectedId === h.id ? 'is-sel' : ''}" data-id="${h.id}" style="--lv:${lv.color}">
      <span class="li-stripe"></span>
      <span class="li-main">
        <span class="li-top"><span class="li-date">${fmtShort(h.date)}</span><span class="li-sec">${h.lieu || ''}</span></span>
        <span class="li-name">${h.nom}</span>
        <span class="li-stats">${h.distance != null ? h.distance.toString().replace('.', ',') + ' km' : ''}${h.denivele != null ? ' · ' + h.denivele + ' m D+' : ''}${h.animateur ? ' · ' + h.animateur : ''}</span>
      </span>
      <span class="li-ibp"><b>${ibpTxt}</b><i>${lv.label.replace('IBP non renseigné', 'n.r.')}</i></span>
    </button>`;
  }

  /* ---------- Marqueurs ---------- */
  function makeIcon(h) {
    const c = h.level.color;
    if (currentDir === 'a') {
      return L.divIcon({ className: 'mk mk-pin', iconSize: [30, 40], iconAnchor: [15, 38], popupAnchor: [0, -36],
        html: `<span class="pin" style="--lv:${c}"><b>${h.ibp == null ? '·' : h.ibp}</b></span>` });
    }
    if (currentDir === 'b') {
      return L.divIcon({ className: 'mk mk-ring', iconSize: [20, 20], iconAnchor: [10, 10], popupAnchor: [0, -10],
        html: `<span class="ring ${selectedId === h.id ? 'is-sel' : ''}" style="--lv:${c}"></span>` });
    }
    return L.divIcon({ className: 'mk mk-dot', iconSize: [18, 18], iconAnchor: [9, 9],
      html: `<span class="dot ${selectedId === h.id ? 'is-sel' : ''}" style="--lv:${c}"></span>` });
  }

  function clusterIcon(cl) {
    const n = cl.getChildCount();
    const s = n < 10 ? 34 : n < 30 ? 42 : 52;
    return L.divIcon({ className: 'cl-wrap', iconSize: [s, s],
      html: `<span class="cl cl-${currentDir}" style="width:${s}px;height:${s}px">${n}</span>` });
  }

  function buildMarkers() {
    if (cluster) cluster.remove();
    cluster = L.markerClusterGroup({ maxClusterRadius: 50, showCoverageOnHover: false,
      spiderfyOnMaxZoom: true, iconCreateFunction: clusterIcon });
    RANDOS.forEach(h => {
      const mk = L.marker([h.lat, h.lon], { icon: makeIcon(h) });
      mk._h = h;
      if (currentDir === 'a') mk.bindPopup(richCard(h, 'pop'),
        { maxWidth: 320, minWidth: 280, className: 'rando-pop', autoPanPadding: [24, 24] });
      mk.on('click', () => select(h.id, false));
      cluster.addLayer(mk);
    });
    map.addLayer(cluster);
  }
  function markerById(id) { let f = null; cluster.eachLayer(m => { if (m._h.id === id) f = m; }); return f; }

  /* ---------- Sélection ---------- */
  function select(id, fly) {
    selectedId = id;
    const h = RANDOS.find(r => r.id === id);
    if (!h) return;
    if (fly !== false) {
      const mk = markerById(id);
      if (mk) cluster.zoomToShowLayer(mk, () => {});
      map.flyTo([h.lat, h.lon], Math.max(map.getZoom(), 12), { duration: 0.6 });
    }
    if (currentDir === 'a') { const mk = markerById(id); if (mk) mk.openPopup(); }
    if (currentDir === 'b') { renderList(); highlightList(id); }
    if (currentDir === 'c') { buildMarkers(); showHero(h); }
  }
  function highlightList(id) {
    document.querySelectorAll('.li').forEach(el => el.classList.toggle('is-sel', +el.dataset.id === id));
    const el = document.querySelector(`.li[data-id="${id}"]`);
    if (el) el.scrollIntoView({ block: 'nearest' });
  }

  function filtered() {
    if (!query) return RANDOS;
    const q = norm(query);
    return RANDOS.filter(h => norm(h.nom).includes(q) || norm(h.lieu).includes(q) || norm(h.animateur).includes(q));
  }
  function renderList() {
    const list = document.getElementById('list');
    if (!list) return;
    const items = filtered();
    document.getElementById('list-count').textContent = items.length;
    list.innerHTML = items.length ? items.map(listItem).join('') : '<div class="empty">Aucune rando ne correspond.</div>';
    list.querySelectorAll('.li').forEach(btn => btn.addEventListener('click', () => select(+btn.dataset.id, true)));
  }
  function showHero(h) {
    const hero = document.getElementById('hero');
    hero.innerHTML = richCard(h, 'hero') + '<button class="hero-close" aria-label="Fermer">✕</button>';
    hero.classList.add('show');
    hero.querySelector('.hero-close').addEventListener('click', () => {
      hero.classList.remove('show'); selectedId = null; buildMarkers();
    });
  }

  /* ---------- Fonds ---------- */
  const TILES = {
    a: { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', opt: { maxZoom: 18, attribution: 'Tuiles © Esri — Esri, USGS, NOAA' } },
    b: { url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', opt: { maxZoom: 19, subdomains: 'abcd', attribution: '© CARTO · © OpenStreetMap' } },
    c: { url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', opt: { maxZoom: 19, subdomains: 'abcd', attribution: '© CARTO · © OpenStreetMap' } }
  };
  function setTiles(dir) { if (tileLayer) tileLayer.remove(); const t = TILES[dir]; tileLayer = L.tileLayer(t.url, t.opt).addTo(map); }

  function setDirection(dir) {
    currentDir = dir;
    selectedId = null;
    document.body.dataset.dir = dir;
    document.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('on', b.dataset.dir === dir));
    const heroEl = document.getElementById('hero');
    if (heroEl) heroEl.classList.remove('show');
    setTiles(dir);
    buildMarkers();
    if (dir === 'b') renderList();
    setTimeout(() => map.invalidateSize(), 60);
  }

  /* ---------- Légende ---------- */
  function fillStats() {
    document.querySelectorAll('.js-total').forEach(el => { el.textContent = RANDOS.length; });
    const order = [...BANDS, NA];
    const counts = new Map();
    RANDOS.forEach(h => counts.set(h.level.label, (counts.get(h.level.label) || 0) + 1));
    const html = order.filter(b => counts.get(b.label)).map(b =>
      `<div class="lg"><span class="lg-dot" style="background:${b.color}"></span>${b.label}<i>${counts.get(b.label)}</i></div>`).join('');
    document.querySelectorAll('.js-legend').forEach(el => { el.innerHTML = html; });
    const first = RANDOS[0], last = RANDOS[RANDOS.length - 1];
    document.querySelectorAll('.js-period').forEach(el => {
      el.textContent = first && last ? `${fmtShort(first.date)} ${first.date.slice(0, 4)} → ${fmtShort(last.date)} ${last.date.slice(0, 4)}` : '';
    });
  }

  function init() {
    map = L.map('map', { zoomControl: false }).setView([43.95, 5.1], 9);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    document.querySelectorAll('.seg-btn').forEach(b => b.addEventListener('click', () => setDirection(b.dataset.dir)));
    const search = document.getElementById('search');
    if (search) search.addEventListener('input', e => { query = e.target.value; renderList(); });
    fillStats();
    setDirection('a');
    map.fitBounds(L.latLngBounds(RANDOS.map(h => [h.lat, h.lon])), { padding: [50, 50] });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

  </script>
